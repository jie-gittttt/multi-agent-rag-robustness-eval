[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-robustness-eval"
version = "0.1.0"
description = "Multi-Agent RAG 鲁棒性与对抗性自动化评估工具"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-Cors>=4.0.1",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.2.0",
    "chromadb>=0.5.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "ragas>=0.4.3,<0.5.0",
    "datasets>=2.18.0",
    "pandas>=2.2.0",
    "Jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "gradio>=4.0.0",
    "langchain-openai>=1.2.0,<2.0.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-community>=0.3.31,<0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
rag-eval = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
